<?xml version="1.0"?>
<?xml-stylesheet href="chrome://global/skin/" type="text/css"?>
<?xml-stylesheet href="chrome://zotero/skin/" type="text/css"?>

<!DOCTYPE window SYSTEM "chrome://zotero-llm-assistant/locale/preferences.dtd">

<window xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
        xmlns:html="http://www.w3.org/1999/xhtml"
        id="zotero-llm-assistant-prefs"
        title="LLM Assistant Preferences"
        onload="Zotero.LLMAssistant.Prefs.init()">

  <vbox class="main-section" style="padding: 12px;">

    <groupbox>
      <caption label="API Configuration" />

      <hbox align="center">
        <label value="API Endpoint:" control="pref-llm-api-endpoint" width="120" />
        <html:input id="pref-llm-api-endpoint"
                    type="text"
                    preference="extensions.zotero-llm-assistant.api-endpoint"
                    style="flex: 1; min-width: 300px;" />
      </hbox>

      <hbox align="center">
        <label value="API Key:" control="pref-llm-api-key" width="120" />
        <html:input id="pref-llm-api-key"
                    type="password"
                    preference="extensions.zotero-llm-assistant.api-key"
                    style="flex: 1; min-width: 300px;" />
      </hbox>

      <hbox align="center">
        <label value="Model:" control="pref-llm-model" width="120" />
        <menulist id="pref-llm-model"
                  preference="extensions.zotero-llm-assistant.model"
                  style="flex: 1;">
          <menupopup>
            <menuitem label="gpt-4o" value="gpt-4o" />
            <menuitem label="gpt-4o-mini" value="gpt-4o-mini" />
            <menuitem label="gpt-3.5-turbo" value="gpt-3.5-turbo" />
            <menuitem label="deepseek-chat" value="deepseek-chat" />
            <menuitem label="deepseek-reasoner" value="deepseek-reasoner" />
            <menuitem label="claude-3-5-sonnet" value="claude-3-5-sonnet" />
            <menuitem label="qwen-plus" value="qwen-plus" />
            <menuitem label="glm-4" value="glm-4" />
            <menuitem label="Custom" value="custom" />
          </menupopup>
        </menulist>
      </hbox>
    </groupbox>

    <groupbox>
      <caption label="Generation Parameters" />

      <hbox align="center">
        <label value="Max Tokens:" control="pref-llm-max-tokens" width="120" />
        <html:input id="pref-llm-max-tokens"
                    type="number"
                    min="256"
                    max="8192"
                    preference="extensions.zotero-llm-assistant.max-tokens"
                    width="100" />
      </hbox>

      <hbox align="center">
        <label value="Temperature:" control="pref-llm-temperature" width="120" />
        <html:input id="pref-llm-temperature"
                    type="number"
                    min="0"
                    max="2"
                    step="0.1"
                    preference="extensions.zotero-llm-assistant.temperature"
                    width="100" />
      </hbox>
    </groupbox>

    <groupbox>
      <caption label="Output Settings" />

      <hbox align="center">
        <label value="Output Language:" control="pref-llm-language" width="120" />
        <menulist id="pref-llm-language"
                  preference="extensions.zotero-llm-assistant.language">
          <menupopup>
            <menuitem label="Chinese" value="Chinese" />
            <menuitem label="English" value="English" />
            <menuitem label="Japanese" value="Japanese" />
            <menuitem label="Korean" value="Korean" />
          </menupopup>
        </menulist>
      </hbox>
    </groupbox>

    <groupbox>
      <caption label="Traditional Translation API (parallel to LLM)" />

      <description style="margin-bottom: 6px; color: #666;">
        Choose one vendor to run alongside the LLM. The plugin renders both
        translations in the PDF tooltip; the LLM remains the source of the
        context-aware meaning. Leave fields blank to skip a vendor.
      </description>

      <hbox align="center">
        <label value="Active Engine:" control="pref-traditional-engine" width="120" />
        <menulist id="pref-traditional-engine"
                  preference="extensions.zotero-llm-assistant.pref-traditional-engine">
          <menupopup>
            <menuitem label="Baidu Translate"   value="baidu" />
            <menuitem label="Youdao Translate"  value="youdao" />
            <menuitem label="Microsoft Azure"   value="azure" />
            <menuitem label="Google Translate"  value="google" />
          </menupopup>
        </menulist>
      </hbox>

      <!-- Baidu -->
      <hbox align="center" style="margin-top: 6px;">
        <label value="Baidu App ID:" control="pref-baidu-appid" width="120" />
        <html:input id="pref-baidu-appid"
                    type="text"
                    preference="extensions.zotero-llm-assistant.pref-baidu-appid"
                    placeholder="百度翻译开放平台 appid"
                    style="flex: 1; min-width: 300px;" />
      </hbox>
      <hbox align="center">
        <label value="Baidu Secret:" control="pref-baidu-key" width="120" />
        <html:input id="pref-baidu-key"
                    type="password"
                    preference="extensions.zotero-llm-assistant.pref-baidu-key"
                    style="flex: 1; min-width: 300px;" />
      </hbox>

      <!-- Youdao -->
      <hbox align="center" style="margin-top: 6px;">
        <label value="Youdao AppKey:" control="pref-youdao-appkey" width="120" />
        <html:input id="pref-youdao-appkey"
                    type="text"
                    preference="extensions.zotero-llm-assistant.pref-youdao-appkey"
                    style="flex: 1; min-width: 300px;" />
      </hbox>
      <hbox align="center">
        <label value="Youdao Secret:" control="pref-youdao-appsecret" width="120" />
        <html:input id="pref-youdao-appsecret"
                    type="password"
                    preference="extensions.zotero-llm-assistant.pref-youdao-appsecret"
                    style="flex: 1; min-width: 300px;" />
      </hbox>

      <!-- Azure -->
      <hbox align="center" style="margin-top: 6px;">
        <label value="Azure Key:" control="pref-azure-key" width="120" />
        <html:input id="pref-azure-key"
                    type="password"
                    preference="extensions.zotero-llm-assistant.pref-azure-key"
                    style="flex: 1; min-width: 300px;" />
      </hbox>
      <hbox align="center">
        <label value="Azure Region:" control="pref-azure-region" width="120" />
        <html:input id="pref-azure-region"
                    type="text"
                    preference="extensions.zotero-llm-assistant.pref-azure-region"
                    placeholder="e.g. eastasia (optional for global resource)"
                    style="flex: 1; min-width: 300px;" />
      </hbox>

      <!-- Google -->
      <hbox align="center" style="margin-top: 6px;">
        <label value="Google API Key:" control="pref-google-key" width="120" />
        <html:input id="pref-google-key"
                    type="password"
                    preference="extensions.zotero-llm-assistant.pref-google-key"
                    style="flex: 1; min-width: 300px;" />
      </hbox>
    </groupbox>

    <hbox style="margin-top: 10px;">
      <button label="Test Connection" oncommand="Zotero.LLMAssistant.Prefs.testConnection()" />
      <spacer flex="1" />
    </hbox>

    <hbox id="test-result" style="margin-top: 5px; display: none;">
      <label id="test-result-label" value="" />
    </hbox>

  </vbox>

</window>
